<div class="px-4 py-1.5 rounded-full bg-surface-bright/90 backdrop-blur-md shadow-lg text-accent-cyan font-label-sm text-label-sm tracking-wide flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span id="feedback-text">Command Transmitted</span>
</div>
</div>
</div>
<script>
  (function initKeysMicroInteractions() {
    const input = document.getElementById('remote-text-input');
    const sendBtn = document.getElementById('send-text-btn');
    const toast = document.getElementById('key-feedback-pill');
    const feedbackText = document.getElementById('feedback-text');
    let toastTimer = null;

    function showHapticFeedback(msg) {
      if (!toast || !feedbackText) return;
      feedbackText.textContent = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 1000);
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(18);
      }
    }

    if (sendBtn && input) {
      const handleSend = () => {
        const val = input.value.trim();
        if (val) {
          showHapticFeedback('Sent: "' + (val.length > 14 ? val.substring(0, 14) + '...' : val) + '"');
          input.value = '';
        } else {
          showHapticFeedback('Input text buffer empty');
        }
      };

      sendBtn.addEventListener('click', handleSend);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          handleSend();
        }
      });
    }

    // Attach haptic feedback and simulated trigger to all hardware key buttons
    const keyButtons = document.querySelectorAll('button[data-key]');
    keyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const keyName = btn.getAttribute('data-key');
        showHapticFeedback('Key: ' + keyName);
      });
    });

    // Make the navigation bar 'Keys' tab reflect active styling as per shell data-active-classes
    const activeNavKeysTab = document.querySelector('nav a[data-path="keys"]');
    if (activeNavKeysTab) {
      activeNavKeysTab.className = "h-12 min-w-[96px] px-4 rounded-full flex items-center justify-center gap-2 bg-gradient-to-r from-accent-cyan to-accent-peach text-canvas-base shadow-[0_0_20px_-2px_rgba(125,211,252,0.35),0_0_32px_-4px_rgba(253,186,116,0.2)] active:scale-95 transition-all";
    }
  })();
