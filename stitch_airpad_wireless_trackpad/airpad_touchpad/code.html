lur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)]"><div class="h-16 px-margin-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-xs shrink-0"><img alt="AirPad logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Wm_dUTb5S9ihz8prToyuuYduwakxN13F8esQxTcon2zoI45A4pFEkk5A_8gHiGSEnifPJtM0F-r7uKxsxbcIbNRhFhWoxTVrIN_jdVCeQgQTot2ukUBlfJ-2BL415ch733_zTw4ysvgeZU4oYBhLR8bLfLLV3szgUyg5FevM29sT6VAUCPtxm1uBnkLYkh5ElKzNDjzZdv7p-Bc_2-5YqkaaMlohcOyjDgQ5WipeCl_VKBivCVTDENU6M4"/><span class="font-headline-sm text-headline-sm font-bold tracking-tight text-text-primary ml-1">AirPad</span></div><div class="flex items-center justify-center shrink-0"><div class="h-8 px-3 rounded-full bg-surface-card flex items-center gap-2 shadow-[inset_0_1px_0_rgba(255,255,255,0.06)]"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#10B981] opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-[#10B981] shadow-[0_0_8px_#10B981]"></span></span><span class="font-label-sm text-label-sm text-text-secondary font-medium tracking-wide">SK-Laptop</span></div></div><div class="flex items-center gap-2 shrink-0"><a aria-label="Settings" class="w-12 h-12 rounded-full bg-surface-raised flex items-center justify-center text-text-muted hover:text-text-primary transition-colors shadow-[inset_0_1px_0_rgba(255,255,255,0.08)] active:scale-95" data-path="device-settings" href="#"><span class="material-symbols-outlined text-[20px]">settings</span></a><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile gap-space-sm select-none">
<!-- Touchpad Interactive Plate -->
<div class="relative w-full rounded-xl bg-canvas-base shadow-[inset_0_4px_20px_rgba(0,0,0,0.7),inset_0_-1px_1px_rgba(255,255,255,0.04)] overflow-hidden flex flex-col justify-between p-space-md min-h-[58vh]">
<!-- Micro-dot tactile grid background overlay -->
<div class="absolute inset-0 pointer-events-none opacity-20" style="background-image: radial-gradient(#bec8ce 1px, transparent 1px); background-size: 20px 20px;"></div>
<!-- Active interactive tracking ripple layer -->
<div class="absolute inset-0 cursor-crosshair touch-none z-10" id="touchpad-surface">
<!-- Glow ripples appear dynamically via script -->
</div>
<!-- Touchpad Top Utility Deck -->
<div class="relative z-20 flex items-center justify-between w-full pointer-events-none">
<div class="flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-card/80 backdrop-blur-md shadow-[inset_0_1px_0_rgba(255,255,255,0.06)]">
<span class="w-2 h-2 rounded-full bg-accent-cyan shadow-[0_0_8px_#7DD3FC]"></span>
<span class="font-label-sm text-label-sm text-text-secondary uppercase tracking-wider">Precision 1:1</span>
</div>
<!-- Expand to Fullscreen Action Button -->
<button aria-label="Enter landscape full screen trackpad" class="pointer-events-auto h-12 px-3 rounded-full bg-surface-raised flex items-center gap-1.5 text-text-secondary active:scale-95 transition-all shadow-[inset_0_1px_0_rgba(255,255,255,0.12),0_4px_12px_rgba(0,0,0,0.5)]" id="fullscreen-btn" type="button">
<span class="material-symbols-outlined text-[20px] text-accent-cyan">open_in_full</span>
<span class="font-label-md text-label-md text-text-primary pr-1">Full</span>
</button>
</div>
<!-- Centered Tactile Instructions -->
<div class="relative z-20 self-center text-center pointer-events-none my-auto flex flex-col items-center gap-space-xs">
<div class="w-12 h-12 rounded-full bg-surface-raised/60 flex items-center justify-center shadow-[inset_0_1px_0_rgba(255,255,255,0.06)] mb-1">
<span class="material-symbols-outlined text-[24px] text-text-muted">touch_app</span>
</div>
<p class="font-body-md text-body-md text-[#F1F5F9] font-medium tracking-normal drop-shadow-sm">
        Swipe to move • Tap to click
      </p>
<p class="font-body-sm text-body-sm text-text-hint">
        Two fingers to scroll • Pinch to zoom
      </p>
</div>
<!-- Right Side Integrated Edge Scroll Rail -->
<div class="absolute right-2 top-16 bottom-16 w-8 flex items-center justify-center z-20 pointer-events-auto">
<div class="relative w-2 h-full rounded-full bg-surface-card shadow-[inset_0_2px_4px_rgba(0,0,0,0.8)] overflow-hidden cursor-ns-resize" id="scroll-track">
<div class="absolute top-1/3 left-0 right-0 h-10 rounded-full bg-gradient-to-b from-accent-cyan to-accent-peach shadow-[0_0_12px_rgba(125,211,252,0.6)] transition-all" id="scroll-thumb"></div>
</div>
</div>
<!-- Corner Decorative Mill Markers -->
<div class="relative z-20 flex justify-between items-end pointer-events-none">
<span class="font-body-sm text-body-sm text-text-hint tracking-wider">ABS REL</span>
<span class="material-symbols-outlined text-[16px] text-text-hint">near_me</span>
</div>
</div>
<!-- Primary Mouse Actuator Block -->
<div class="flex items-center gap-space-xs w-full pt-1">
<!-- Left Click (Primary Weighted) -->
<button class="flex-[1.6] h-16 min-h-[64px] rounded-lg bg-surface-card flex items-center justify-center gap-2 text-text-primary transition-all active:scale-[0.98] shadow-[inset_0_1px_0_rgba(255,255,255,0.1),0_8px_20px_rgba(0,0,0,0.5)] active:shadow-[inset_0_3px_8px_rgba(0,0,0,0.7)] group" id="left-click" type="button">
<span class="material-symbols-outlined text-[22px] text-accent-cyan group-active:text-accent-peach transition-colors">mouse</span>
<span class="font-headline-sm text-headline-sm font-semibold text-text-primary tracking-tight">Left Click</span>
</button>
<!-- Right Click (Secondary Complement) -->
<button class="flex-1 h-16 min-h-[64px] rounded-lg bg-surface-raised flex items-center justify-center gap-1.5 text-text-secondary transition-all active:scale-[0.98] shadow-[inset_0_1px_0_rgba(255,255,255,0.08),0_6px_16px_rgba(0,0,0,0.45)] active:shadow-[inset_0_3px_8px_rgba(0,0,0,0.7)]" id="right-click" type="button">
<span class="material-symbols-outlined text-[20px] text-text-muted">contextual_token</span>
<span class="font-headline-sm text-headline-sm font-medium text-text-primary tracking-tight">Right</span>
</button>
</div>
<!-- Ergonomic Utility Strip -->
<div class="flex items-center justify-between gap-space-xs w-full pb-2">

<button aria-pressed="false" class="h-12 min-h-[48px] px-4 rounded-full bg-surface-card flex items-center gap-2.5 transition-all active:scale-95 shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_4px_12px_rgba(0,0,0,0.35)]" id="drag-lock-btn" type="button">
<span class="w-3 h-3 rounded-full bg-text-hint transition-all duration-300" id="drag-indicator"></span>
<span class="font-label-md text-label-md text-text-primary">Drag Lock</span>
<span class="material-symbols-outlined text-[18px] text-text-muted">lock</span>
</button>
<!-- Speed Adjustment Modular Chip -->
<div class="h-12 min-h-[48px] px-3.5 rounded-full bg-surface-card flex items-center gap-3 shadow-[inset_0_1px_0_rgba(255,255,255,0.06),0_4px_12px_rgba(0,0,0,0.35)] flex-1 max-w-[200px]">
<div class="flex items-center gap-1 shrink-0">
<span class="material-symbols-outlined text-[18px] text-accent-cyan">speed</span>
<span class="font-label-md text-label-md text-text-primary" id="speed-label">Speed 6</span>
</div>
<!-- Tactile Slider Well -->
<div class="relative w-full flex items-center">
<input aria-label="Pointer Speed" class="w-full h-2 rounded-full appearance-none cursor-pointer bg-canvas-base shadow-[inset_0_1px_3px_rgba(0,0,0,0.8)] accent-accent-peach" id="speed-slider" max="10" min="1" type="range" value="6"/>
</div>
</div>
</div>
</div>
<script>
  (function () {
    // Touchpad surface tactile feedback ripple
    const pad = document.getElementById('touchpad-surface');
    if (pad) {
      pad.addEventListener('pointerdown', (e) => {
        const rect = pad.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const ping = document.createElement('div');
        ping.className = 'absolute w-10 h-10 rounded-full pointer-events-none -translate-x-1/2 -translate-y-1/2 bg-gradient-to-r from-accent-cyan to-accent-peach opacity-60 blur-[1px] transition-transform duration-500 scale-100 ease-out';
        ping.style.left = x + 'px';
        ping.style.top = y + 'px';
        pad.appendChild(ping);
        requestAnimationFrame(() => {
          ping.style.transform = 'translate(-50%, -50%) scale(2.8)';
          ping.style.opacity = '0';
        });
        setTimeout(() => ping.remove(), 550);
      });
    }

    // Scroll rail thumb tactile interaction
    const scrollTrack = document.getElementById('scroll-track');
    const scrollThumb = document.getElementById('scroll-thumb');
    let isScrolling = false;

    if (scrollTrack && scrollThumb) {
      const updateScroll = (clientY) => {
        const rect = scrollTrack.getBoundingClientRect();
        const offset = Math.max(0, Math.min(clientY - rect.top - 20, rect.height - 40));
        scrollThumb.style.top = offset + 'px';
      };

      scrollTrack.parentElement.addEventListener('pointerdown', (e) => {
        isScrolling = true;
        updateScroll(e.clientY);
      });

      window.addEventListener('pointermove', (e) => {
        if (isScrolling) updateScroll(e.clientY);
      });

      window.addEventListener('pointerup', () => {
        isScrolling = false;
      });
    }

    // Drag Lock State Toggle
    const dragBtn = document.getElementById('drag-lock-btn');
    const dragDot = document.getElementById('drag-indicator');
    let dragLocked = false;

    if (dragBtn && dragDot) {
      dragBtn.addEventListener('click', () => {
        dragLocked = !dragLocked;
        dragBtn.setAttribute('aria-pressed', dragLocked ? 'true' : 'false');
        if (dragLocked) {
          dragDot.classList.remove('bg-text-hint');
          dragDot.classList.add('bg-accent-peach', 'shadow-[0_0_10px_#FDBA74]');
          dragBtn.classList.add('bg-surface-raised');
        } else {
          dragDot.classList.remove('bg-accent-peach', 'shadow-[0_0_10px_#FDBA74]');
          dragDot.classList.add('bg-text-hint');
          dragBtn.classList.remove('bg-surface-raised');
        }
      });
    }

    // Pointer Speed dynamic read-out
    const speedSlider = document.getElementById('speed-slider');
    const speedLabel = document.getElementById('speed-label');
    if (speedSlider && speedLabel) {
      speedSlider.addEventListener('input', (e) => {
        speedLabel.textContent = 'Speed ' + e.target.value;
      });
    }

    // Full screen orientation hook
    const fsBtn = document.getElementById('fullscreen-btn');
    if (fsBtn) {
      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-[#14151D]/90 backdrop-blur-xl shadow-[0_-8px_30px_rgba(0,0,0,0.6)]" data-active-classes="bg-gradient-to-r from-accent-cyan to-accent-peach text-canvas-base shadow-[0_0_20px_-2px_rgba(125,211,252,0.35),0_0_32px_-4px_rgba(253,186,116,0.2)]"><div class="h-20 px-margin-mobile flex items-center justify-around"><a aria-current="page" class="h-12 min-w-[96px] px-4 rounded-full flex items-center justify-center gap-2 transition-all active:scale-95 bg-gradient-to-r from-accent-cyan to-accent-peach text-canvas-base shadow-[0_0_20px_-2px_rgba(125,211,252,0.35),0_0_32px_-4px_rgba(253,186,116,0.2)]" data-path="touchpad" href="#"><span class="material-symbols-outlined text-[22px]">touch_app</span><span class="font-label-md text-label-md">Touchpad</span></a><a class="h-12 min-w-[96px] px-4 rounded-full flex items-center justify-center gap-2 text-text-muted hover:text-text-primary transition-all active:scale-95" data-path="keys" href="#"><span class="material-symbols-outlined text-[22px]">keyboard_command_key</span><span class="font-label-md text-label-md">Keys</span></a><a class="h-12 min-w-[96px] px-4 rounded-full flex items-center justify-center gap-2 text-text-muted hover:text-text-primary transition-all active:scale-95" data-path="media" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-md text-label-md">Media</span></a></div></nav></body></html>
